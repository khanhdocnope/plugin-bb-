plugins {
    id 'java'
}

group = 'vn.bloodharvest'
version = '0.1.0-MVP'
description = 'BloodHarvest SMP - Blood Moon + Seasons + Farming MVP for Paper 1.20.6'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    archiveBaseName = 'BloodHarvest'
}
