plugins {
    id 'java'
}

group = 'vn.bloodharvest'
version = '1.0.0'
description = 'BloodHarvest SMP - Blood Moon + Seasons + Farming v1.0 for Paper 1.20.6'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    archiveBaseName = 'BloodHarvest'
}
