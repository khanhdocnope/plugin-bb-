name: BloodHarvest
version: 1.1.0
main: vn.bloodharvest.BloodHarvestPlugin
api-version: '1.20'
author: BloodHarvest Team
description: Blood Moon + Seasons + Farming + TPA v1.1 - nhe cho server 2.5GB
website: https://github.com/anomalyco/opencode
commands:
  bh:
    description: Lệnh chính BloodHarvest
    usage: /bh <mua|lich|bloodmoon|boss|give|enchant|help>
    permission: bloodharvest.use
    aliases: [bloodharvest]
  tpa:
    description: Gửi yêu cầu dịch chuyển tới người chơi
    usage: /tpa <tên>
    permission: bloodharvest.tpa
  tpahere:
    description: Mời người chơi dịch chuyển đến chỗ bạn
    usage: /tpahere <tên>
    permission: bloodharvest.tpa
  tpaccept:
    description: Chấp nhận yêu cầu dịch chuyển
    usage: /tpaccept [tên]
    permission: bloodharvest.tpa
  tpdeny:
    description: Từ chối yêu cầu dịch chuyển
    usage: /tpdeny [tên]
    permission: bloodharvest.tpa
  tpcancel:
    description: Hủy yêu cầu đã gửi
    usage: /tpcancel
    permission: bloodharvest.tpa
  tptoggle:
    description: Bật/tắt nhận yêu cầu dịch chuyển
    usage: /tptoggle
    permission: bloodharvest.tpa
permissions:
  bloodharvest.use:
    default: true
  bloodharvest.tpa:
    default: true
  bloodharvest.admin:
    default: op
